[project]
name = "panoptic-mining"
version = "0.1.0"
description = "Panoptic segmentation for illegal mining detection in FAC aerial video (thesis project)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "scipy>=1.12",
    "pyyaml>=6.0",
    "typer>=0.12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
vision = [
    "torch>=2.2",
    "torchvision>=0.17",
    "pycocotools>=2.0.7",
]

[project.scripts]
panoptic-mining = "panoptic_mining.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/panoptic_mining"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
